<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crackheadz Secret Santa</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<meta name="description" content="Joinable Secret Santa: add your name, vote on the date, share gift ideas, and reveal only your own assignment." />
<style>
:root{
    --night:#0d1030; --night2:#1b2350; --night3:#2a2a6a;
    --snow:#f4f6ff; --paper:#fff8e7; --card:#fffdf4;
    --ink:#101018; --muted:#4a4a68;
    --red:#e83800; --red-dark:#a81e00; --green:#00a800; --pine:#005800;
    --gold:#f8d800; --gold-dark:#c8a800; --blue:#3b5bff;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--night); color:var(--ink);
    font-family:"VT323", "Courier New", monospace; font-size:21px; line-height:1.35;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 130px 90px, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 70px 150px, #f8d800 50%, transparent 51%),
      radial-gradient(2px 2px at 220px 40px, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 300px 120px, #fff 50%, transparent 51%);
    background-size:340px 220px;
  }
  #snow-canvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; opacity:.9}
  main{position:relative; z-index:2; max-width:680px; margin:0 auto; padding:14px 14px 0}
  /* ---- arcade HUD ---- */
  @keyframes blink{50%{opacity:0}}
  /* ---- hero: night sky scene ---- */
  .hero{
    position:relative; overflow:hidden;
    background:linear-gradient(#141b3d 0%, #1b2350 55%, #2a2a6a 100%);
    border:4px solid #000; box-shadow:8px 8px 0 #000;
    padding:22px 18px 0; margin:0 0 22px; color:var(--snow);
  }
  .twinkle-star{position:absolute; width:7px; height:7px; background:#fff; z-index:1; animation:starBlink 1.4s steps(2) infinite}
  .twinkle-star.gold{background:var(--gold)}
  .twinkle-star:nth-child(3n){animation-delay:.45s}
  .twinkle-star:nth-child(4n){animation-delay:.9s}
  .twinkle-star:nth-child(5n){animation-delay:.2s; width:5px; height:5px}
  @keyframes starBlink{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.05; transform:scale(.4)}}
  .elf-stage{position:absolute; left:0; right:0; bottom:8px; height:64px; overflow:hidden; pointer-events:none; z-index:2}
  .elf-run{position:absolute; bottom:0; left:0; width:34px; height:44px; animation:elfRun 14s linear infinite}
  .elf-run.late{animation-delay:-7s}
  @keyframes elfRun{0%{transform:translateX(-50px)}100%{transform:translateX(720px)}}
  .elf-run svg{width:34px; height:44px; image-rendering:pixelated; shape-rendering:crispEdges; animation:elfBob .35s steps(2) infinite}
  @keyframes elfBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .snowball{position:absolute; left:26px; top:14px; width:7px; height:7px; background:#fff; border:2px solid #000; animation:throwBall 1.4s ease-in infinite}
  @keyframes throwBall{0%{transform:translate(0,0); opacity:1}55%{transform:translate(56px,-34px); opacity:1}100%{transform:translate(110px,6px); opacity:0}}
  .hero .moon{
    position:absolute; right:18px; top:16px; width:52px; height:52px;
    background:var(--gold); border:4px solid #000;
    box-shadow:inset -8px -8px 0 #e8b800;
    image-rendering:pixelated;
  }
  .hero .moon::after{content:""; position:absolute; left:8px; top:10px; width:8px; height:8px; background:#c8a800; box-shadow:18px 12px 0 #c8a800, 6px 26px 0 #c8a800}
  h1{
    font-family:"Press Start 2P", monospace; font-size:clamp(28px, 8.5vw, 44px);
    line-height:1.25; margin:0 0 14px; color:#fff; text-shadow:4px 4px 0 #000, 8px 8px 0 rgba(232,56,0,.55);
  }
  h1 .red{color:#ff5a2a}
  h1 .rainbow{background:linear-gradient(90deg,#ff004c,#ff8a00,#f8d800,#00a800,#3b5bff,#b800ff,#ff004c); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; text-shadow:none; animation:rainbow 3s linear infinite; filter:drop-shadow(4px 4px 0 #000)}
  @keyframes rainbow{to{background-position:300% 0}}
  .hero p{color:#dfe6ff; margin:8px 0; max-width:44ch; font-size:22px}
  .hero p b{color:var(--gold)}
  /* Santa sleigh flyover */
  .sleigh-track{position:relative; height:86px; overflow:visible; margin:6px -18px 0}
  .sleigh{
    position:absolute; top:8px; left:0; width:300px; height:72px;
    animation:fly 12s linear infinite, sleighBob 1.2s ease-in-out infinite;
    filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45));
  }
  .sleigh svg{width:300px; height:72px; image-rendering:pixelated; shape-rendering:crispEdges}
  @keyframes sleighBob{0%,100%{margin-top:0}50%{margin-top:-6px}}
  @keyframes fly{
    0%{transform:translateX(105vw) translateY(0)}
    25%{transform:translateX(60vw) translateY(-10px)}
    50%{transform:translateX(20vw) translateY(4px)}
    75%{transform:translateX(-20vw) translateY(-8px)}
    100%{transform:translateX(-340px) translateY(0)}
  }
  .rudolph{animation:rudolph 0.9s steps(2) infinite}
  @keyframes rudolph{50%{opacity:.25}}
  .ground{
    display:block; width:calc(100% + 36px); margin:0 -18px; height:74px;
  }
  /* ---- pixel cards ---- */
  .card{
    background:var(--card); border:4px solid #000; box-shadow:8px 8px 0 #000;
    padding:20px 16px; margin:0 0 22px; position:relative;
  }
  .card::before{
    content:""; position:absolute; left:-4px; top:-4px; width:28px; height:8px;
    background:var(--red); border:4px solid #000; border-left:0; border-top:0;
  }
  .card.green::before{background:var(--green)}
  .card.gold::before{background:var(--gold)}
  .level{font-family:"Press Start 2P", monospace; font-size:9px; color:var(--red); margin:0 0 10px; text-transform:uppercase}
  .card.green .level{color:var(--pine)} .card.gold .level{color:#8a6d00}
  h2{font-family:"Press Start 2P", monospace; font-size:17px; line-height:1.5; margin:0 0 10px; text-transform:uppercase}
  h3{font-family:"Press Start 2P", monospace; font-size:11px; line-height:1.6; margin:22px 0 10px; text-transform:uppercase}
  p{margin:8px 0}
  .small{font-size:19px; color:var(--muted)}
  .setup-notice{border:4px solid #000; background:var(--gold); box-shadow:6px 6px 0 #000; padding:14px; margin:0 0 22px; font-family:"Press Start 2P", monospace; font-size:11px; line-height:1.7}
  label{display:block; font-family:"Press Start 2P", monospace; font-size:10px; margin:14px 0 8px; text-transform:uppercase}
  input, select, textarea{
    width:100%; min-height:56px; padding:12px; font-size:23px;
    font-family:"VT323", monospace; border:4px solid #000; background:#fff; color:var(--ink);
    box-shadow:inset 4px 4px 0 #e8e8f0;
  }
  input:focus, select:focus{outline:4px solid var(--gold); outline-offset:2px}
  button{
    min-height:56px; padding:14px 16px; font-family:"Press Start 2P", monospace; font-size:12px; line-height:1.5;
    border:4px solid #000; background:var(--red); color:#fff; cursor:pointer; width:100%; margin-top:14px;
    box-shadow:0 6px 0 #000; text-transform:uppercase;
  }
  button:active{transform:translateY(4px); box-shadow:0 2px 0 #000}
  .start-button{width:auto; min-width:220px; margin:16px 0 8px; background:var(--red); animation:startPulse 1.6s ease-in-out infinite}
  @keyframes startPulse{0%,100%{box-shadow:0 6px 0 #000}50%{box-shadow:0 6px 0 #000, 0 0 0 6px rgba(248,216,0,.55)}}
  .hero .moon{animation:moonBreathe 4s ease-in-out infinite}
  @keyframes moonBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .card{animation:cardIn .5s ease both}
  @keyframes cardIn{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:translateY(0)}}
  .gift-thumb{transition:transform .2s steps(3)}
  .gift-thumb:hover{transform:scale(1.15) rotate(-3deg)}
  button:hover{filter:brightness(1.12)}
  .hero-location{font-family:"Press Start 2P", monospace; font-size:11px; line-height:1.7; color:var(--gold); margin:0 0 18px; text-transform:uppercase}
  .gift-thumb{width:64px; height:64px; object-fit:cover; border:3px solid #000; flex:none}
  .gift-item{align-items:center}
  .msg-item{border-top:3px solid #000; padding:10px 0}
  .msg-item .msg-author{font-family:"Press Start 2P", monospace; font-size:10px; text-transform:uppercase}
  .buying-owner{font-family:"Press Start 2P", monospace; font-size:11px; margin:18px 0 6px; text-transform:uppercase}
  .buying-item{display:flex; gap:12px; align-items:center; border-top:3px solid #000; padding:10px 0}
  .buying-item button{width:auto; min-height:44px; margin-top:0; padding:8px 12px; font-size:10px}
  button.secondary{background:#fff; color:var(--ink)}
  button.green{background:var(--green); color:#fff}
  button.danger{background:#fff; color:var(--red-dark); border-color:#000}
  button:disabled{opacity:.45; cursor:not-allowed; box-shadow:0 6px 0 #000}
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{outline:4px solid var(--gold); outline-offset:2px}
  .row{display:grid; gap:12px}
  @media (min-width:520px){.row.two{grid-template-columns:1fr 1fr}}
  ul{padding-left:20px; margin:8px 0}
  li{margin:6px 0}
  .participant-count{display:inline-block; transition:transform .25s ease; color:var(--red)}
  .participant-count.pulse{transform:scale(1.4)}
  .participant-chip{
    display:inline-block; background:var(--gold); border:3px solid #000;
    box-shadow:3px 3px 0 #000; padding:6px 10px; margin:4px 6px 4px 0;
    font-family:"Press Start 2P", monospace; font-size:10px;
  }
  .result{
    border:4px solid #000; background:var(--gold); box-shadow:6px 6px 0 #000;
    padding:18px; margin-top:16px; font-size:23px; position:relative; overflow:hidden;
  }
  .result .label{font-family:"Press Start 2P", monospace; font-size:9px; color:var(--ink); display:block; margin-bottom:8px; text-transform:uppercase}
  .result.celebrate{animation:glow 1.2s ease 2}
  @keyframes glow{0%,100%{box-shadow:6px 6px 0 #000}50%{box-shadow:6px 6px 0 #000, 0 0 0 6px var(--red)}}
  .confetti-piece{position:absolute; top:-8px; width:8px; height:8px; animation:fall 1.6s ease-in forwards; pointer-events:none}
  @keyframes fall{to{transform:translateY(180px) rotate(240deg); opacity:0}}
  .poll-option{
    display:block; width:100%; background:#fff; color:var(--ink); text-align:left;
    border:4px solid #000; padding:14px 12px 14px; box-shadow:0 4px 0 #000;
  }
  .poll-option[aria-pressed="true"]{background:var(--green); color:#fff}
  .poll-option[aria-pressed="true"] .bar-track{background:rgba(255,255,255,.35)}
  .poll-meta{display:flex; justify-content:space-between; gap:12px; font-size:21px}
  .bar-track{height:12px; background:#e8e8f0; border:2px solid #000; margin-top:10px; overflow:hidden}
  .bar-fill{height:100%; width:0%; background:repeating-linear-gradient(90deg, var(--gold) 0 8px, #e8b800 8px 16px); transition:width .6s steps(12)}
  .poll-option[aria-pressed="true"] .bar-fill{background:repeating-linear-gradient(90deg, #fff 0 8px, var(--gold) 8px 16px)}
  .gift-item{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-top:3px solid #000; padding:12px 0}
  .gift-item button{width:auto; min-height:44px; margin-top:0; padding:8px 12px; font-size:10px}
  .gift-item a{color:var(--red-dark); font-weight:700}
  .shuffle{text-align:center; font-family:"Press Start 2P", monospace; font-size:13px; padding:14px 0 4px; color:var(--red); min-height:44px}
  .tree-row{display:flex; justify-content:space-between; align-items:flex-end; gap:6px; margin:6px 0 0; padding:0 2px}
  .tree-row svg{width:52px; height:64px; image-rendering:pixelated; shape-rendering:crispEdges}
  .tree-light{animation:twinkle 1s steps(2) infinite}
  .tree-light:nth-child(2){animation-delay:.3s} .tree-light:nth-child(3){animation-delay:.6s}
  @keyframes twinkle{50%{opacity:.15}}
  footer{margin:0 0 28px; padding:18px 16px; border:4px solid #000; background:var(--paper); box-shadow:8px 8px 0 #000}
  footer h2{font-size:12px}
  footer a{display:block; margin-top:12px; font-family:"Press Start 2P", monospace; font-size:10px; line-height:1.7; color:var(--red-dark)}
  .error{color:var(--red-dark); font-weight:700}
  .hidden{display:none}
  @media (max-width:420px){
    body{font-size:20px}
    h1{font-size:26px}
    .sleigh{width:240px} .sleigh svg{width:240px}
    }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
    html{scroll-behavior:auto}
    .sleigh{animation:none; transform:translateX(20px)}
  }
</style>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<script>
  // Group data connection. Fill the two values below before publishing.
  // Use the public read key for this group only, never a private service key.
  var API_BASE_URL = "https://dqcoincagejyowqxqqnz.supabase.co";
  var API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxY29pbmNhZ2VqeW93cXhxcW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMzY4NTQsImV4cCI6MjEwNjcxMjg1NH0.dG7GwddKfuoq08DX_SgtluxWKAU-hyAjMZcAc320ysI";

  var DATE_OPTIONS = [
    { id: "birthday-dec-5", label: "At my birthday, Sat Dec 5, 2026, house" },
    { id: "new-years-dec-31", label: "At New Year's, Dec 31, 2026" },
    { id: "separate-night", label: "A separate Secret Santa night, date TBD" }
  ];

  var state = {
    participants: [],
    votes: [],
    wishlists: [],
    messages: [],
    draw: null,
    connected: false,
    lastCount: null
  };

  function isConfigured() {
    return API_BASE_URL &&
      API_BASE_URL.indexOf("YOUR_") === -1 &&
      API_KEY &&
      API_KEY.indexOf("YOUR_") === -1 &&
      API_BASE_URL.indexOf("https://") === 0;
  }

  function apiHeaders() {
    return {
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY,
      "Content-Type": "application/json"
    };
  }

  function apiFetch(path, options) {
    var base = API_BASE_URL.replace(/\/$/, "") + "/rest/v1";
    var opts = options || {};
    opts.headers = Object.assign({}, apiHeaders(), opts.headers || {});
    return fetch(base + path, opts);
  }

  function esc(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function reducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function setMessage(id, text, isError) {
    var el = document.getElementById(id);
    el.textContent = text || "";
    el.className = isError ? "error" : "";
  }

  function setControlsEnabled(enabled) {
    ["name-input", "add-button", "lock-button", "unlock-button", "draw-button",
     "reset-button", "reveal-name", "reveal-button", "gift-owner", "gift-item",
     "gift-note", "gift-image", "gift-amazon-search", "gift-add-button", "voter-name",
     "finder-query", "finder-search-button", "message-author", "message-input",
     "message-send-button", "email-group-button", "buying-toggle-button"].forEach(function (id) {
      document.getElementById(id).disabled = !enabled;
    });
  }

  function keepSelect(id) {
    return document.getElementById(id).value;
  }

  function fillSelect(id, value) {
    var el = document.getElementById(id);
    var options = state.participants.map(function (p) {
      return '<option value="' + esc(p.name) + '">' + esc(p.name) + "</option>";
    }).join("");
    el.innerHTML = options;
    if (value && state.participants.some(function (p) { return p.name === value; })) {
      el.value = value;
    }
  }

  function renderParticipants() {
    var previousReveal = keepSelect("reveal-name");
    var previousVoter = keepSelect("voter-name");
    var previousGift = keepSelect("gift-owner");
    var list = document.getElementById("participant-list");
    list.innerHTML = state.participants.map(function (p) {
      return '<span class="participant-chip">' + esc(p.name) + "</span>";
    }).join("");
    var countEl = document.getElementById("participant-count");
    countEl.textContent = state.participants.length;
    if (state.lastCount !== null && state.lastCount !== state.participants.length && !reducedMotion()) {
      countEl.classList.add("pulse");
      setTimeout(function () { countEl.classList.remove("pulse"); }, 600);
    }
    state.lastCount = state.participants.length;
    document.getElementById("empty-list").classList.toggle("hidden", state.participants.length > 0);
    fillSelect("reveal-name", previousReveal);
    fillSelect("voter-name", previousVoter);
    fillSelect("gift-owner", previousGift);
    var status = "Open";
    if (state.draw && state.draw.status === "locked") status = "Locked";
    if (state.draw && state.draw.status === "drawn") status = "Drawn";
    document.getElementById("draw-state").textContent = status;
    document.getElementById("draw-button").disabled = !state.connected ||
      !(state.draw && state.draw.status === "locked") || state.participants.length < 3;
    document.getElementById("lock-button").disabled = !state.connected ||
      !!(state.draw && state.draw.status !== "open");
    document.getElementById("unlock-button").disabled = !state.connected ||
      !(state.draw && state.draw.status === "locked");
    document.getElementById("reveal-button").disabled = !state.connected ||
      !(state.draw && state.draw.status === "drawn") || state.participants.length === 0;
  }

  function voteCount(optionId) {
    return state.votes.filter(function (v) {
      return v.poll_id === "date" && v.option_id === optionId;
    }).length;
  }

  function renderPolls() {
    var voter = document.getElementById("voter-name").value;
    var total = state.votes.filter(function (v) { return v.poll_id === "date"; }).length;
    var mine = state.votes.find(function (v) {
      return v.poll_id === "date" && v.voter_name === voter;
    });
    document.getElementById("date-poll").innerHTML = DATE_OPTIONS.map(function (opt) {
      var count = voteCount(opt.id);
      var pct = total ? Math.round((count / total) * 100) : 0;
      var pressed = mine && mine.option_id === opt.id ? "true" : "false";
      return '<button type="button" class="poll-option" aria-pressed="' + pressed +
        '" data-option="' + opt.id + '"><span class="poll-meta"><span>' + esc(opt.label) +
        "</span><span>" + count + " vote" + (count === 1 ? "" : "s") + " (" + pct + "%)</span></span>" +
        '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span></button>';
    }).join("");
    document.querySelectorAll(".poll-option").forEach(function (btn) {
      btn.disabled = !state.connected || !voter;
      btn.addEventListener("click", function () { castVote("date", btn.dataset.option); });
    });
  }

  function renderWishlists() {
    var owner = document.getElementById("gift-owner").value;
    var mine = state.wishlists.filter(function (w) { return w.owner_name === owner; });
    var list = document.getElementById("gift-list");
    list.innerHTML = mine.map(function (w) {
      var note = "";
      if (w.link_or_note) {
        if (w.link_or_note.indexOf("http://") === 0 || w.link_or_note.indexOf("https://") === 0) {
          note = '<div><a href="' + esc(w.link_or_note) + '" target="_blank" rel="noopener">View link</a></div>';
        } else {
          note = "<div>" + esc(w.link_or_note) + "</div>";
        }
      }
      var thumb = w.image_url ? '<img class="gift-thumb" src="' + esc(w.image_url) + '" alt="" />' : "";
      return '<div class="gift-item">' + thumb + '<div><strong>' + esc(w.item) + "</strong>" + note +
        '</div><button type="button" class="secondary danger gift-delete" data-id="' + esc(w.id) + '">Delete</button></div>';
    }).join("");
    document.getElementById("gift-empty").classList.toggle("hidden", mine.length > 0 || !owner);
    document.querySelectorAll(".gift-delete").forEach(function (btn) {
      btn.disabled = !state.connected;
      btn.addEventListener("click", function () { deleteGift(btn.dataset.id); });
    });
  }

  function renderGiftListForRecipient(recipient) {
    var items = state.wishlists.filter(function (w) { return w.owner_name === recipient; });
    var el = document.getElementById("reveal-gift-list");
    if (!items.length) {
      el.innerHTML = '';
      return;
    }
    el.innerHTML = "<h3>Their gift ideas</h3><ul>" + items.map(function (w) {
      var note = "";
      if (w.link_or_note) {
        if (w.link_or_note.indexOf("http://") === 0 || w.link_or_note.indexOf("https://") === 0) {
          note = ' — <a href="' + esc(w.link_or_note) + '" target="_blank" rel="noopener">View link</a>';
        } else {
          note = " — " + esc(w.link_or_note);
        }
      }
      var thumb = w.image_url ? ' <img class="gift-thumb" src="' + esc(w.image_url) + '" alt="" />' : "";
      return "<li><strong>" + esc(w.item) + "</strong>" + thumb + note + "</li>";
    }).join("") + "</ul>";
  }

  function amazonSearchUrl(q) {
    return "https://www.amazon.com/s?k=" + encodeURIComponent(q);
  }

  function renderMessages() {
    var list = document.getElementById("message-list");
    list.innerHTML = state.messages.map(function (m) {
      return '<div class="msg-item"><div class="msg-author">' + esc(m.author_name) + '</div><div>' + esc(m.message) + "</div></div>";
    }).join("");
    fillSelect("message-author", keepSelect("message-author"));
  }

  function renderBuyingView() {
    var view = document.getElementById("buying-view");
    if (view.classList.contains("hidden")) return;
    var owners = [];
    state.wishlists.forEach(function (w) {
      if (owners.indexOf(w.owner_name) === -1) owners.push(w.owner_name);
    });
    view.innerHTML = owners.map(function (owner) {
      var items = state.wishlists.filter(function (w) { return w.owner_name === owner; });
      return '<div class="buying-owner">' + esc(owner) + "</div>" + items.map(function (w) {
        var thumb = w.image_url ? '<img class="gift-thumb" src="' + esc(w.image_url) + '" alt="" />' : "";
        var link = "";
        if (w.link_or_note && (w.link_or_note.indexOf("http://") === 0 || w.link_or_note.indexOf("https://") === 0)) {
          link = '<div><a href="' + esc(w.link_or_note) + '" target="_blank" rel="noopener">View link</a></div>';
        }
        return '<div class="buying-item">' + thumb + '<div><strong>' + esc(w.item) + "</strong>" + link +
          '</div><button type="button" class="secondary buying-amazon" data-query="' + esc(w.item) + '">Amazon</button></div>';
      }).join("");
    }).join("");
    view.querySelectorAll(".buying-amazon").forEach(function (btn) {
      btn.addEventListener("click", function () { window.open(amazonSearchUrl(btn.dataset.query), "_blank", "noopener"); });
    });
  }

  function renderAll() {
    renderParticipants();
    renderPolls();
    renderWishlists();
    renderMessages();
    renderBuyingView();
  }

  function derangement(names) {
    var shuffled = names.slice();
    for (var attempt = 0; attempt < 200; attempt++) {
      for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
      }
      var ok = shuffled.every(function (name, idx) { return name !== names[idx]; });
      if (ok) return shuffled;
    }
    return names.slice(1).concat(names.slice(0, 1));
  }

  function celebrate() {
    if (reducedMotion()) return;
    var box = document.getElementById("reveal-result");
    box.classList.add("celebrate");
    var colors = ["#f8d800", "#e83800", "#00a800", "#ffffff"];
    for (var i = 0; i < 24; i++) {
      var piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.style.left = (4 + Math.random() * 92) + "%";
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = (Math.random() * 0.35) + "s";
      box.appendChild(piece);
    }
    setTimeout(function () {
      box.querySelectorAll(".confetti-piece").forEach(function (p) { p.remove(); });
      box.classList.remove("celebrate");
    }, 2200);
  }

  async function loadAll() {
    if (!isConfigured()) {
      state.connected = false;
      document.getElementById("setup-notice").classList.remove("hidden");
      setControlsEnabled(false);
      renderAll();
      return;
    }
    document.getElementById("setup-notice").classList.add("hidden");
    try {
      var drawsRes = await apiFetch("/draws?select=id,status,created_at&order=created_at.desc&limit=1");
      if (!drawsRes.ok) throw new Error("Could not load the draw.");
      var draws = await drawsRes.json();
      state.draw = draws.length ? draws[0] : null;
      var partsRes = await apiFetch("/participants?select=id,name,email,created_at&order=created_at.asc");
      if (!partsRes.ok) throw new Error("Could not load participants.");
      state.participants = await partsRes.json();
      var votesRes = await apiFetch("/poll_votes?select=poll_id,option_id,voter_name");
      if (!votesRes.ok) throw new Error("Could not load votes.");
      state.votes = await votesRes.json();
      var giftsRes = await apiFetch("/wishlists?select=id,owner_name,item,link_or_note,image_url,created_at&order=created_at.asc");
      if (!giftsRes.ok) throw new Error("Could not load gift lists.");
      state.wishlists = await giftsRes.json();
      var msgsRes = await apiFetch("/group_messages?select=id,author_name,message,created_at&order=created_at.asc");
      if (!msgsRes.ok) throw new Error("Could not load messages.");
      state.messages = await msgsRes.json();
      state.connected = true;
      setControlsEnabled(true);
      renderAll();
    } catch (err) {
      state.connected = false;
      document.getElementById("setup-notice").classList.remove("hidden");
      document.getElementById("setup-notice").textContent = "Setting up your group, try reloading in a moment.";
      setControlsEnabled(false);
      renderAll();
    }
  }

  async function addParticipant() {
    var input = document.getElementById("name-input");
    var name = input.value.trim();
    if (!name) { setMessage("join-message", "Type your name first.", true); return; }
    if (state.participants.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })) {
      setMessage("join-message", "That name is already on the list.", true); return;
    }
    try {
      var emailEl = document.getElementById("email-input");
      var email = emailEl.value.trim();
      var res = await apiFetch("/participants", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({ name: name, email: email || null })
      });
      if (!res.ok) throw new Error("Could not add that name. It may already be on the list.");
      input.value = "";
      emailEl.value = "";
      setMessage("join-message", "You are on the list.");
      await loadAll();
    } catch (err) {
      setMessage("join-message", err.message, true);
    }
  }

  async function setDrawStatus(status) {
    if (!state.draw) {
      var res = await apiFetch("/draws", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({ status: status })
      });
      if (!res.ok) throw new Error("Could not create the draw record.");
      state.draw = (await res.json())[0];
    } else {
      var patch = await apiFetch("/draws?id=eq." + state.draw.id, {
        method: "PATCH",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({ status: status })
      });
      if (!patch.ok) throw new Error("Could not update the draw status.");
      state.draw = (await patch.json())[0];
    }
    await loadAll();
  }

  async function runDraw() {
    if (!state.draw || state.draw.status !== "locked") {
      setMessage("join-message", "Lock the list first, then draw.", true); return;
    }
    if (state.participants.length < 3) {
      setMessage("join-message", "The draw needs at least 3 people.", true); return;
    }
    var names = state.participants.map(function (p) { return p.name; });
    var shuffleEl = document.getElementById("draw-shuffle");
    var shuffleName = document.getElementById("draw-shuffle-name");
    if (!reducedMotion()) {
      shuffleEl.classList.remove("hidden");
      var tick = 0;
      var timer = setInterval(function () {
        shuffleName.textContent = names[tick % names.length];
        tick++;
      }, 90);
      await new Promise(function (resolve) { setTimeout(resolve, 1200); });
      clearInterval(timer);
    }
    try {
      var recipients = derangement(names);
      var rows = names.map(function (giver, i) {
        return { draw_id: state.draw.id, giver_name: giver, recipient_name: recipients[i] };
      });
      var res = await apiFetch("/assignments", {
        method: "POST",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify(rows)
      });
      if (!res.ok) throw new Error("Could not save the draw. Try again.");
      shuffleEl.classList.add("hidden");
      await setDrawStatus("drawn");
      setMessage("join-message", "The draw is done. Each person can now reveal only their own person.");
    } catch (err) {
      shuffleEl.classList.add("hidden");
      setMessage("join-message", err.message, true);
    }
  }

  async function resetDraw() {
    if (!state.draw) { setMessage("join-message", "There is no draw to reset yet."); return; }
    if (!window.confirm("Reset this draw? This clears the assignments and reopens the list.")) return;
    try {
      await apiFetch("/assignments?draw_id=eq." + state.draw.id, { method: "DELETE" });
      await setDrawStatus("open");
      document.getElementById("reveal-result").classList.add("hidden");
      document.getElementById("hide-button").classList.add("hidden");
      setMessage("join-message", "The draw was reset and the list is open again.");
    } catch (err) {
      setMessage("join-message", "Could not reset the draw. " + err.message, true);
    }
  }

  async function revealAssignment() {
    var giver = document.getElementById("reveal-name").value;
    if (!giver || !state.draw) return;
    try {
      var res = await fetch(
        API_BASE_URL.replace(/\/$/, "") + "/rest/v1/rpc/reveal_assignment",
        {
          method: "POST",
          headers: apiHeaders(),
          body: JSON.stringify({ p_giver: giver, p_draw_id: state.draw.id })
        }
      );
      if (!res.ok) throw new Error("Reveal is not available yet. Try reloading in a moment.");
      var rows = await res.json();
      if (!rows.length) { setMessage("reveal-message", "No assignment was found for that name.", true); return; }
      document.getElementById("reveal-person").textContent = rows[0].recipient_name;
      renderGiftListForRecipient(rows[0].recipient_name);
      document.getElementById("reveal-result").classList.remove("hidden");
      document.getElementById("hide-button").classList.remove("hidden");
      setMessage("reveal-message", "");
      celebrate();
    } catch (err) {
      setMessage("reveal-message", err.message, true);
    }
  }

  async function addGift() {
    var owner = document.getElementById("gift-owner").value;
    var itemEl = document.getElementById("gift-item");
    var noteEl = document.getElementById("gift-note");
    var item = itemEl.value.trim();
    if (!owner) { setMessage("gift-message", "Pick your name first.", true); return; }
    if (!item) { setMessage("gift-message", "Type a gift idea first.", true); return; }
    try {
      var imageEl = document.getElementById("gift-image");
      var res = await apiFetch("/wishlists", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({ owner_name: owner, item: item, link_or_note: noteEl.value.trim() || null, image_url: imageEl.value.trim() || null })
      });
      if (!res.ok) throw new Error("Could not add that gift idea.");
      itemEl.value = "";
      noteEl.value = "";
      imageEl.value = "";
      setMessage("gift-message", "Gift idea added.");
      await loadAll();
    } catch (err) {
      setMessage("gift-message", err.message, true);
    }
  }

  async function deleteGift(id) {
    if (!window.confirm("Delete this gift idea?")) return;
    try {
      var res = await apiFetch("/wishlists?id=eq." + encodeURIComponent(id), { method: "DELETE" });
      if (!res.ok) throw new Error("Could not delete that gift idea.");
      setMessage("gift-message", "Gift idea deleted.");
      await loadAll();
    } catch (err) {
      setMessage("gift-message", err.message, true);
    }
  }

  async function castVote(pollId, optionId) {
    var voter = document.getElementById("voter-name").value;
    if (!voter) { setMessage("poll-message", "Pick your name first, then vote.", true); return; }
    try {
      var res = await apiFetch("/poll_votes?on_conflict=voter_name,poll_id", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
        body: JSON.stringify({ voter_name: voter, poll_id: pollId, option_id: optionId })
      });
      if (!res.ok) throw new Error("Could not save that vote.");
      setMessage("poll-message", "Your vote was saved.");
      await loadAll();
    } catch (err) {
      setMessage("poll-message", err.message, true);
    }
  }

  async function postMessage() {
    var author = document.getElementById("message-author").value;
    var input = document.getElementById("message-input");
    var text = input.value.trim();
    if (!author) { setMessage("message-message", "Pick your name first.", true); return; }
    if (!text) { setMessage("message-message", "Type a message first.", true); return; }
    try {
      var res = await apiFetch("/group_messages", {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({ author_name: author, message: text })
      });
      if (!res.ok) throw new Error("Could not send that message.");
      input.value = "";
      setMessage("message-message", "Message sent.");
      await loadAll();
    } catch (err) {
      setMessage("message-message", err.message, true);
    }
  }

  function emailGroup() {
    var emails = state.participants.map(function (p) { return p.email; }).filter(function (e) { return e; });
    if (!emails.length) { setMessage("message-message", "No emails saved yet.", true); return; }
    window.location.href = "mailto:?bcc=" + encodeURIComponent(emails.join(",")) + "&subject=" + encodeURIComponent("Secret Santa");
  }

  function startSnowfall() {
    if (reducedMotion()) return;
    var canvas = document.getElementById("snow-canvas");
    var ctx = canvas.getContext("2d");
    var flakes = [];
    var stars = [];
    var shooting = null;
    var shootingTimer = 0;
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      flakes = [];
      var count = Math.min(90, Math.max(40, Math.floor(window.innerWidth / 14)));
      for (var i = 0; i < count; i++) {
        flakes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 2 + Math.random() * 2.2,
          speed: 0.25 + Math.random() * 0.45,
          drift: Math.random() * 0.6
        });
      }
      stars = [];
      var starCount = Math.min(60, Math.max(24, Math.floor(window.innerWidth / 24)));
      for (var s = 0; s < starCount; s++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.7,
          r: 2 + Math.random() * 2.5,
          phase: Math.random() * Math.PI * 2,
          speed: 0.6 + Math.random() * 1.8
        });
      }
    }
    function tick(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var t = (now || 0) / 1000;
      stars.forEach(function (st) {
        var a = Math.abs(Math.sin(t * st.speed + st.phase));
        ctx.fillStyle = "rgba(255, 255, 255, " + a.toFixed(2) + ")";
        ctx.fillRect(st.x, st.y, st.r * 2, st.r * 2);
        if (a > 0.9) {
          ctx.fillStyle = "rgba(248, 216, 0, " + (a - 0.6).toFixed(2) + ")";
          ctx.fillRect(st.x - 2, st.y - 2, st.r * 2 + 4, st.r * 2 + 4);
        }
      });
      shootingTimer++;
      if (!shooting && shootingTimer > 360 && Math.random() < 0.02) {
        shooting = { x: Math.random() * canvas.width * 0.7 + canvas.width * 0.2, y: Math.random() * canvas.height * 0.25, vx: -7, vy: 3, life: 1 };
        shootingTimer = 0;
      }
      if (shooting) {
        ctx.strokeStyle = "rgba(255, 255, 255, " + shooting.life.toFixed(2) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(shooting.x, shooting.y);
        ctx.lineTo(shooting.x + 42, shooting.y - 14);
        ctx.stroke();
        shooting.x += shooting.vx;
        shooting.y += shooting.vy;
        shooting.life -= 0.03;
        if (shooting.life <= 0) shooting = null;
      }
      ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
      flakes.forEach(function (f) {
        f.y += f.speed;
        f.x += Math.sin(f.y / 60) * f.drift * 0.3;
        if (f.y > canvas.height + 5) { f.y = -5; f.x = Math.random() * canvas.width; }
        ctx.fillRect(f.x, f.y, f.r * 2, f.r * 2);
      });
      requestAnimationFrame(tick);
    }
    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(tick);
  }

  document.getElementById("start-button").addEventListener("click", function () {
    document.getElementById("join-heading").scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
    document.getElementById("name-input").focus({ preventScroll: true });
  });
  document.getElementById("add-button").addEventListener("click", addParticipant);
  document.getElementById("lock-button").addEventListener("click", function () {
    setDrawStatus("locked").catch(function (e) { setMessage("join-message", e.message, true); });
  });
  document.getElementById("unlock-button").addEventListener("click", function () {
    setDrawStatus("open").catch(function (e) { setMessage("join-message", e.message, true); });
  });
  document.getElementById("draw-button").addEventListener("click", runDraw);
  document.getElementById("reset-button").addEventListener("click", resetDraw);
  document.getElementById("reveal-button").addEventListener("click", revealAssignment);
  document.getElementById("hide-button").addEventListener("click", function () {
    document.getElementById("reveal-result").classList.add("hidden");
    document.getElementById("hide-button").classList.add("hidden");
    document.getElementById("reveal-person").textContent = "";
    document.getElementById("reveal-gift-list").innerHTML = "";
  });
  document.getElementById("gift-add-button").addEventListener("click", addGift);
  document.getElementById("gift-amazon-search").addEventListener("click", function () {
    var q = document.getElementById("gift-item").value.trim();
    if (!q) { setMessage("gift-message", "Type a gift idea first.", true); return; }
    window.open(amazonSearchUrl(q), "_blank", "noopener");
  });
  document.getElementById("finder-search-button").addEventListener("click", function () {
    var q = document.getElementById("finder-query").value.trim();
    if (!q) { setMessage("finder-message", "Type what you are looking for first.", true); return; }
    window.open(amazonSearchUrl(q), "_blank", "noopener");
    setMessage("finder-message", "Results opened on Amazon. Paste the link back in My gift list.");
  });
  document.getElementById("message-send-button").addEventListener("click", postMessage);
  document.getElementById("email-group-button").addEventListener("click", emailGroup);
  document.getElementById("buying-toggle-button").addEventListener("click", function () {
    var view = document.getElementById("buying-view");
    view.classList.toggle("hidden");
    document.getElementById("buying-toggle-button").textContent = view.classList.contains("hidden") ? "Show all gift lists" : "Hide all gift lists";
    renderBuyingView();
  });
  document.getElementById("gift-owner").addEventListener("change", renderWishlists);
  document.getElementById("voter-name").addEventListener("change", renderPolls);

  startSnowfall();
  loadAll();
  setInterval(function () {
    if (!document.hidden) loadAll();
  }, 5000);
</script>
